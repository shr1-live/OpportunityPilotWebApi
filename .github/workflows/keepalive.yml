# Keeps the free Render instance awake so scheduled campaign runs fire on time.
# Render's free web service sleeps after ~15 minutes without traffic, and a sleeping service cannot run the
# ScheduleProcessor (it polls every 30 s). This pings the health endpoint every 10 minutes; the repo is public,
# so Actions minutes are free. GitHub may delay scheduled runs by a few minutes under load.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the API
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10 \
            https://opportunitypilotwebapi.onrender.com/health/live

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OpportunityPilot.sln
      - run: dotnet build OpportunityPilot.sln --configuration Release --no-restore
      - run: dotnet test OpportunityPilot.sln --configuration Release --no-build
      # The EF model and the migrations must match for both providers, or a deploy would migrate the wrong schema.
      - run: dotnet tool install --global dotnet-ef --version "10.*"
      - name: Migrations match the model (SqlServer, Postgres)
        run: |
          for c in SqlServer Postgres; do
            dotnet ef migrations has-pending-model-changes -p src/OpportunityPilot.Infrastructure -s src/OpportunityPilot.Api               --context ${c}AppDbContext --configuration Release --no-build
          done
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
